name: Android Port

on:
  push:
    branches: [android-port]
    tags: ["v*-android*"]
  pull_request:
    branches: [android-port]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-port-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK (${{ matrix.abi }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # Phase 1: ship arm64-v8a only — other ABIs will be enabled after the
      # full toolchain proves itself. Update the matrix once gradle + cap add
      # are stable and splits.abi is wired into build.gradle.kts.
      matrix:
        abi: [arm64-v8a]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        id: setup-android
        uses: android-actions/setup-android@v3
        with:
          # Capacitor 6 targets API 34. Pin to known versions to avoid surprises.
          # Explicitly request packages so the action does not try to install the
          # deprecated `tools` package, which newer sdkmanager refuses to find.
          api-level: 34
          build-tools-version: 34.0.0
          packages: >-
            cmdline-tools;latest
            platform-tools
            platforms;android-34
            build-tools;34.0.0

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install workspace deps
        # First run needs to refresh the lockfile because packages/mobile was
        # just added with new catalog entries. After that, switch back to
        # `--frozen-lockfile` to detect unwanted dependency drift.
        run: bun install

      - name: Build packages/app
        run: bun --cwd packages/app build

      - name: Scaffold Android project (idempotent)
        run: |
          if [ ! -f packages/mobile/android/build.gradle ]; then
            echo "[scaffold] first run: cap add android"
            cd packages/mobile && bunx cap add android
          else
            echo "[scaffold] android/ already present, skipping"
          fi

      - name: Sync web assets into android/
        # `cap add android` does not create the web assets directory. `cap sync`
        # refuses to run if `webDir` is missing. mkdir first, then run sync.
        run: |
          mkdir -p packages/mobile/android/app/src/main/assets/public
          cd packages/mobile && bunx cap sync android

      - name: Assemble release APK
        # Phase 0: ship universal APK to verify the toolchain. Per-ABI matrix
        # + abiFilters wiring lands in Phase 1 once the basic build is green.
        working-directory: packages/mobile/android
        env:
          ANDROID_HOME: ${{ steps.setup-android.outputs.android-home }}
        run: |
          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Rename APK
        working-directory: packages/mobile/android
        run: |
          mkdir -p dist
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} dist/ \;
          mv dist/*.apk dist/opencode-mobile-universal.apk 2>/dev/null || true
          ls -la dist/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: opencode-mobile-${{ matrix.abi }}
          path: packages/mobile/android/dist/*.apk
          if-no-files-found: error

  publish:
    name: Publish APKs
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all APKs
        uses: actions/download-artifact@v4
        with:
          path: apks

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: apks/**/*.apk
          generate_release_notes: true
name: Android Port

on:
  push:
    branches: [android-port]
    tags: ["v*-android*"]
  pull_request:
    branches: [android-port]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-port-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK (${{ matrix.abi }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install workspace deps
        run: bun install --frozen-lockfile

      - name: Build packages/app
        run: bun --cwd packages/app build

      - name: Install mobile deps
        run: bun install --cwd packages/mobile --no-save

      - name: Scaffold Android project (idempotent)
        run: |
          if [ ! -f packages/mobile/android/build.gradle ]; then
            echo "[scaffold] first run: cap add android"
            bun --cwd packages/mobile x cap add android
          else
            echo "[scaffold] android/ already present, skipping"
          fi

      - name: Sync web assets into android/
        run: bun --cwd packages/mobile run copy:web

      - name: Assemble release APK
        working-directory: packages/mobile/android
        env:
          ANDROID_HOME: ${{ steps.setup-android.outputs.android-home }}
        run: |
          ./gradlew \
            :app:assembleRelease \
            -PreactNativeArchitectures=${{ matrix.abi }} \
            --no-daemon \
            --stacktrace

      - name: Rename APK
        working-directory: packages/mobile/android
        run: |
          mkdir -p dist
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} dist/opencode-mobile-${{ matrix.abi }}.apk \;
          ls -la dist/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: opencode-mobile-${{ matrix.abi }}
          path: packages/mobile/android/dist/*.apk
          if-no-files-found: error

  publish:
    name: Publish APKs
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all APKs
        uses: actions/download-artifact@v4
        with:
          path: apks

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: apks/**/*.apk
          generate_release_notes: true
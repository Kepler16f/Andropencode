name: Android Port

on:
  push:
    branches: [android-port]
    tags: ["v*-android*"]
  pull_request:
    branches: [android-port]
  workflow_dispatch:
    # Manual dispatch forces the user to choose a version in the GitHub
    # Actions UI. We do NOT silently default — if versionName / versionCode
    # are missing, the build runs against the values currently pinned in
    # packages/mobile/scripts/patch-android.mjs (0.1.1 / 101) and only the
    # upload step is allowed to proceed. This keeps routine push CI fast
    # while making manual release runs gated on a deliberate choice.
    inputs:
      version_name:
        description: "Semantic version name (e.g. 0.1.1)"
        required: false
        default: ""
        type: string
      version_code:
        description: "Android versionCode integer (e.g. 101)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: android-port-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK (${{ matrix.abi }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # Phase 1: ship arm64-v8a only — other ABIs will be enabled after the
      # full toolchain proves itself. Update the matrix once gradle + cap add
      # are stable and splits.abi is wired into build.gradle.kts.
      matrix:
        abi: [arm64-v8a]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        id: setup-android
        uses: android-actions/setup-android@v3
        with:
          # setup-android@v3 only accepts: cmdline-tools-version,
          # accept-android-sdk-licenses, log-accepted-android-sdk-licenses,
          # packages. Do NOT pass api-level / build-tools-version here.
          # Capacitor 6 targets API 34 — pin via `packages` below.
          accept-android-sdk-licenses: true
          packages: >-
            cmdline-tools;latest
            platform-tools
            platforms;android-34
            build-tools;34.0.0

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install workspace deps
        # First run needs to refresh the lockfile because packages/mobile was
        # just added with new catalog entries. After that, switch back to
        # `--frozen-lockfile` to detect unwanted dependency drift.
        run: bun install

      - name: Build packages/app
        run: bun --cwd packages/app build

      - name: Inject dispatched version (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        # workflow_dispatch inputs override the version constants in
        # patch-android.mjs so the human-supplied versionName / versionCode
        # lands in the assembled APK. Push and tag triggers leave the file
        # untouched — the user is expected to edit the constants and push.
        run: |
          if [ -n "${{ inputs.version_name }}" ]; then
            sed -i 's/const VERSION_NAME = "0.1.1"/const VERSION_NAME = "${{ inputs.version_name }}"/' \
              packages/mobile/scripts/patch-android.mjs
            echo "[version-inject] version_name -> ${{ inputs.version_name }}"
          fi
          if [ -n "${{ inputs.version_code }}" ]; then
            sed -i 's/const VERSION_CODE = 101/const VERSION_CODE = ${{ inputs.version_code }}/' \
              packages/mobile/scripts/patch-android.mjs
            echo "[version-inject] version_code -> ${{ inputs.version_code }}"
          fi

      - name: Build opencode server bundle
        # Bundle the opencode server entry into a single file Bun can run on
        # Android. `--outdir` (not `--outfile`) because `bun build` emits
        # multiple artefacts alongside the JS (e.g. source maps) for any
        # non-trivial tree and refuses `--outfile` in that case.
        run: |
          rm -rf packages/mobile/android-app/assets/server
          mkdir -p packages/mobile/android-app/assets/server
          bun build packages/opencode/src/cli/cmd/serve.ts \
            --target=bun \
            --outdir packages/mobile/android-app/assets/server \
            --external @lydell/node-pty \
            --external @parcel/watcher
          ls -lh packages/mobile/android-app/assets/server/
          # Print which files came out so we can pick the right one in
          # OpencodeService.
          find packages/mobile/android-app/assets/server -maxdepth 1 -type f

      - name: Scaffold Android project (idempotent)
        run: |
          if [ ! -f packages/mobile/android/build.gradle ]; then
            echo "[scaffold] first run: cap add android"
            cd packages/mobile && bunx cap add android
            # First run only — commit the generated android/ tree so subsequent
            # runs reuse it and reviewers can see what we generated.
            cd "$GITHUB_WORKSPACE"
            git add packages/mobile/android
            git -c user.name="Mavis" -c user.email="Mavis@local" \
              commit -m "chore(mobile): track Capacitor-generated android/ tree" \
                --no-verify || echo "no changes to commit"
            git push origin android-port
          else
            echo "[scaffold] android/ already present, skipping"
          fi

      - name: Sync web assets into android/
        # `cap sync` reads from capacitor.config.ts webDir (../app/dist, the
        # build output of packages/app) and copies into android/app/src/main/
        # assets/public. It also generates capacitor.settings.gradle and
        # *regenerates* res/values/strings.xml from capacitor.config.ts appName.
        # Run BEFORE patch-android so our overlay (with custom strings.xml,
        # ForegroundService, etc.) lands last.
        run: cd packages/mobile && bunx cap sync android

      - name: Patch android/ with Phase 1 Kotlin sidecar
        # Overlays our MainActivity / OpencodeService / BunDownloader /
        # LocalReverseProxy / OpencodeServerInitializer onto the generated
        # tree, plus an AndroidManifest template that registers the foreground
        # service. Must run after `cap sync` because cap sync overwrites
        # strings.xml from capacitor.config.ts appName.
        run: node packages/mobile/scripts/patch-android.mjs

      - name: Assemble debug APK
        # We use assembleDebug (not Release) for Phase 1/2 because the release
        # signing config is intentionally empty — an unsigned APK won't install
        # on Android 7+. Switching to a real release key is a Phase 3 concern
        # (sideload distribution doesn't require Play Store keys).
        # ANDROID_SDK_ROOT is set by setup-android above; do NOT also set
        # ANDROID_HOME to a different value or Gradle will refuse with
        # "Several environment variables ... contain different paths to the SDK".
        working-directory: packages/mobile/android
        run: |
          ./gradlew \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Rename APK
        working-directory: packages/mobile/android
        run: |
          mkdir -p dist
          find app/build/outputs/apk/debug -name "*.apk" -exec cp {} dist/ \;
          mv dist/*.apk dist/andropencode-debug.apk 2>/dev/null || true
          ls -la dist/

      - name: Upload APK
        # GitHub Actions requires artefacts to ship inside a zip — the path
        # glob below picks up the .apk we built and zips it as the sole file.
        # The zip is one level deep only; consumers can `unzip` and grab the
        # .apk immediately. For users that want the apk directly (without a
        # zip wrapper) the publish job below attaches the same file to the
        # GitHub Release as a raw download.
        uses: actions/upload-artifact@v4
        with:
          name: andropencode-${{ matrix.abi }}-0.1.1
          path: packages/mobile/android/dist/andropencode-debug.apk
          if-no-files-found: error

  publish:
    name: Publish APKs (raw .apk)
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all APKs
        uses: actions/download-artifact@v4
        with:
          path: apks

      - name: Attach raw .apk to GitHub Release
        # action-gh-release@v2 attaches each file as a GitHub Release asset —
        # users download a single .apk with no zip wrapping.
        uses: softprops/action-gh-release@v2
        with:
          files: apks/**/*.apk
          generate_release_notes: true
          # `name:` here would override the tag-based release name; leave it
          # alone so v0.1.1-android tags get releases titled "v0.1.1-android".
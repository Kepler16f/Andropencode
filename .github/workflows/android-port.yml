name: Android Port

on:
  push:
    branches: [android-port]
    tags: ["v*-android*"]
  pull_request:
    branches: [android-port]
  workflow_dispatch:
    # Manual dispatch forces the user to choose a version in the GitHub
    # Actions UI. We do NOT silently default — if versionName / versionCode
    # are missing, the build runs against the values currently pinned in
    # packages/mobile/scripts/patch-android.mjs (0.3.0 / 300) and only the
    # upload step is allowed to proceed. This keeps routine push CI fast
    # while making manual release runs gated on a deliberate choice.
    inputs:
      version_name:
        description: "Semantic version name (e.g. 0.2.0)"
        required: false
        default: ""
        type: string
      version_code:
        description: "Android versionCode integer (e.g. 200)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: android-port-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK (${{ matrix.abi }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # Phase 1: ship arm64-v8a only — other ABIs will be enabled after the
      # full toolchain proves itself. Update the matrix once gradle + cap add
      # are stable and splits.abi is wired into build.gradle.kts.
      matrix:
        abi: [arm64-v8a]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        id: setup-android
        uses: android-actions/setup-android@v3
        with:
          # setup-android@v3 only accepts: cmdline-tools-version,
          # accept-android-sdk-licenses, log-accepted-android-sdk-licenses,
          # packages. Do NOT pass api-level / build-tools-version here.
          # Capacitor 6 targets API 34 — pin via `packages` below.
          accept-android-sdk-licenses: true
          packages: >-
            cmdline-tools;latest
            platform-tools
            platforms;android-34
            build-tools;34.0.0

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install workspace deps
        # First run needs to refresh the lockfile because packages/mobile was
        # just added with new catalog entries. After that, switch back to
        # `--frozen-lockfile` to detect unwanted dependency drift.
        run: bun install

      - name: Build packages/app
        env:
          # entry.tsx reads VITE_OPENCODE_SERVER_HOST/PORT to build the
          # getCurrentUrl() base in production; without it the SPA falls back
          # to location.origin (http://localhost on some abstracted WebViews).
          VITE_OPENCODE_SERVER_HOST: "127.0.0.1"
          VITE_OPENCODE_SERVER_PORT: "4096"
        run: bun --cwd packages/app build

      - name: Inject dispatched version (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        # workflow_dispatch inputs override the version constants in
        # patch-android.mjs so the human-supplied versionName / versionCode
        # lands in the assembled APK. Push and tag triggers leave the file
        # untouched — the user is expected to edit the constants and push.
        run: |
          if [ -n "${{ inputs.version_name }}" ]; then
            sed -i 's/const VERSION_NAME = "[^"]*"/const VERSION_NAME = "${{ inputs.version_name }}"/' \
              packages/mobile/scripts/patch-android.mjs
            echo "[version-inject] version_name -> ${{ inputs.version_name }}"
          fi
          if [ -n "${{ inputs.version_code }}" ]; then
            sed -i 's/const VERSION_CODE = [0-9]*/const VERSION_CODE = ${{ inputs.version_code }}/' \
              packages/mobile/scripts/patch-android.mjs
            echo "[version-inject] version_code -> ${{ inputs.version_code }}"
          fi

      - name: Build opencode server bundle
        # Bundle the opencode server entry into a single file Bun can run on
        # Android. `--outdir` (not `--outfile`) because `bun build` emits
        # multiple artefacts alongside the JS (e.g. source maps) for any
        # non-trivial tree and refuses `--outfile` in that case.
        #
        # `--conditions android` resolves the core package's `#pty` /
        # `#watcher` conditional imports to the Android backends. bun@1.3.14
        # predates Conditions support in `bun build`; on failure we fall back
        # to the default conditions (desktop pty / watcher get rejected at
        # runtime by Bun's loader — the app degrades to the pipe/noop
        # fallbacks) so a green build is never held hostage to the flag.
        run: |
          rm -rf packages/mobile/android-app/assets/server
          mkdir -p packages/mobile/android-app/assets/server
          if bun build packages/opencode/src/cli/cmd/serve.ts \
            --target=bun \
            --conditions android \
            --outdir packages/mobile/android-app/assets/server \
            --external @lydell/node-pty \
            --external @parcel/watcher 2>/tmp/bun-build-conditions.log; then
            echo "[bundle] --conditions android accepted"
          else
            echo "[bundle] --conditions android unsupported on bun@1.3.14, retrying without:"
            cat /tmp/bun-build-conditions.log
            bun build packages/opencode/src/cli/cmd/serve.ts \
              --target=bun \
              --outdir packages/mobile/android-app/assets/server \
              --external @lydell/node-pty \
              --external @parcel/watcher
          fi
          ls -lh packages/mobile/android-app/assets/server/
          # Print which files came out so we can pick the right one in
          # OpencodeService.
          find packages/mobile/android-app/assets/server -maxdepth 1 -type f

      - name: Stage native assets (arm64-v8a)
        # Download the Termux ripgrep/pcre2/libc++ debs + node-pty prebuild and
        # stage the files under android-app/assets/native/, where
        # patch-android.mjs copies them into the APK. arm64-v8a only; other
        # ABIs fall back to the non-interactive shell pipe (see README).
        run: bash packages/mobile/scripts/stage-native-assets.sh

      - name: Scaffold Android project (idempotent)
        run: |
          if [ ! -f packages/mobile/android/build.gradle ]; then
            echo "[scaffold] first run: cap add android"
            cd packages/mobile && bunx cap add android
            # First run only — commit the generated android/ tree so subsequent
            # runs reuse it and reviewers can see what we generated.
            cd "$GITHUB_WORKSPACE"
            git add packages/mobile/android
            git -c user.name="Mavis" -c user.email="Mavis@local" \
              commit -m "chore(mobile): track Capacitor-generated android/ tree" \
                --no-verify || echo "no changes to commit"
            git push origin android-port
          else
            echo "[scaffold] android/ already present, skipping"
          fi

      - name: Sync web assets into android/
        # `cap sync` reads from capacitor.config.ts webDir (../app/dist, the
        # build output of packages/app) and copies into android/app/src/main/
        # assets/public. It also generates capacitor.settings.gradle and
        # *regenerates* res/values/strings.xml from capacitor.config.ts appName.
        # Run BEFORE patch-android so our overlay (with custom strings.xml,
        # ForegroundService, etc.) lands last.
        run: cd packages/mobile && bunx cap sync android

      - name: Patch android/ with Kotlin sidecar
        # Overlays our MainActivity / OpencodeService / BunDownloader / bridge
        # plugins (FsBridge, ShellBridge, Biometric) / LocalReverseProxy /
        # OpencodeServerInitializer onto the generated tree, plus an
        # AndroidManifest template that registers the foreground service and
        # copies the staged native assets into the APK. Must run after `cap
        # sync` because cap sync overwrites strings.xml from appName.
        id: patch
        run: |
          # Dump the app/build.gradle version block BEFORE patching so we can
          # see in CI logs exactly what cap add generated and what the
          # patch-android regex rewrote it to. This is the single best way
          # to confirm the version injection actually took effect.
          echo "[patch] app/build.gradle defaultConfig BEFORE patch:"
          grep -A1 -B1 -E '^\s*version' packages/mobile/android/app/build.gradle | sed 's/^/    /'

          node packages/mobile/scripts/patch-android.mjs

          echo "[patch] app/build.gradle defaultConfig AFTER patch:"
          grep -A1 -B1 -E '^\s*version' packages/mobile/android/app/build.gradle | sed 's/^/    /'

          # Expose the version the script pinned so downstream steps (artifact
          # name, release notes) can reference a single source of truth rather
          # than hardcoding 0.1.1 / 0.3.0 / … in the workflow file.
          VERSION_NAME=$(grep -E '^\s*const VERSION_NAME' packages/mobile/scripts/patch-android.mjs | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -E '^\s*const VERSION_CODE' packages/mobile/scripts/patch-android.mjs | head -1 | sed -E 's/.*=\s*([0-9]+).*/\1/')
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "[patch-android] exposed version_name=$VERSION_NAME, version_code=$VERSION_CODE"

      - name: Assemble debug APK
        # We use assembleDebug (not Release) for Phase 1/2 because the release
        # signing config is intentionally empty — an unsigned APK won't install
        # on Android 7+. Switching to a real release key is a Phase 3 concern
        # (sideload distribution doesn't require Play Store keys).
        # ANDROID_SDK_ROOT is set by setup-android above; do NOT also set
        # ANDROID_HOME to a different value or Gradle will refuse with
        # "Several environment variables ... contain different paths to the SDK".
        working-directory: packages/mobile/android
        run: |
          ./gradlew \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Rename APK
        working-directory: packages/mobile/android
        run: |
          mkdir -p dist
          find app/build/outputs/apk/debug -name "*.apk" -exec cp {} dist/ \;
          mv dist/*.apk dist/andropencode-debug.apk 2>/dev/null || true
          ls -la dist/

      - name: Upload APK (raw, no zip wrapper)
        # actions/upload-artifact@v7 introduced `archive: false` which skips
        # the zip step and uploads the file as-is. Two constraints from the
        # release notes:
        #   * Only single files are supported. The glob below must resolve
        #     to exactly one APK or the step fails.
        #   * The `name` parameter is ignored. The artifact's display name
        #     is the uploaded file's basename (andropencode-debug.apk).
        # Result: the artifact is downloadable as a raw .apk with no extra
        # unzip step required.
        uses: actions/upload-artifact@v7
        with:
          name: andropencode-${{ matrix.abi }}-${{ steps.patch.outputs.version_name }}.apk
          path: packages/mobile/android/dist/andropencode-debug.apk
          archive: false
          if-no-files-found: error

      - name: Print APK manifest facts
        # Use aapt2 from the Android SDK to dump the actual versionName /
        # versionCode / package / sdkVersion / permissions of the APK we
        # just built. This is the only ground-truth the user has for
        # confirming they downloaded the right artifact — the GitHub
        # Actions page can cache older runs and the artifact filename
        # alone is not enough.
        working-directory: packages/mobile/android
        run: |
          AAPT2="$ANDROID_HOME/build-tools/34.0.0/aapt2"
          "$AAPT2" dump badging dist/andropencode-debug.apk 2>&1 | \
            grep -E "package:|sdkVersion:|targetSdkVersion:|application-label:" | \
            sed 's/^/    [apk] /'
          echo ""
          echo "    [apk] file size: $(stat -c %s dist/andropencode-debug.apk) bytes"
          echo "    [apk] sha256:    $(sha256sum dist/andropencode-debug.apk | awk '{print $1}')"

  publish:
    name: Publish APKs (raw .apk)
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all APKs
        uses: actions/download-artifact@v4
        with:
          path: apks

      - name: Attach raw .apk to GitHub Release
        # action-gh-release@v2 attaches each file as a GitHub Release asset —
        # users download a single .apk with no zip wrapping.
        uses: softprops/action-gh-release@v2
        with:
          files: apks/**/*.apk
          generate_release_notes: true
          # `name:` here would override the tag-based release name; leave it
          # alone so v0.1.1-android tags get releases titled "v0.1.1-android".